name: Release npm packages

# Publishes @oakestra/api, @oakestra/dashboard-sdk and @oakestra/ui to GitHub Packages, and to
# npmjs.com as well once the repo variable PUBLISH_TO_NPMJS is "true".
#
# Pushes to main that touch them publish a snapshot (0.1.1-main.<run>) under "next", like the
# image's "latest". Releases go through Changesets: pending changesets keep a
# "chore: version packages" PR open, merging it publishes under "latest".
# Versions don't follow the image's v* tags, addons are checked against the SDK and ui versions.

on:
  push:
    branches: [main]
    paths:
      - 'packages/api/**'
      - 'packages/dashboard-sdk/**'
      - 'packages/ui/**'
      - '.changeset/**'
      - 'tools/package-checks/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/release-packages.yml'
  workflow_dispatch:

# Never cancel: a publish stopped halfway leaves some packages on the new version.
concurrency:
  group: release-packages
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLISH_TO_NPMJS: ${{ vars.PUBLISH_TO_NPMJS }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Push the version PR branch and the release tags.
      contents: write
      pull-requests: write
      packages: write
      # npmjs trusted publishing and provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - run: .github/scripts/npm-auth.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Open or update the version PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # With no changesets pending, package.json holds the versions to release. Those already
      # published are skipped, so this is a no-op on most pushes.
      - name: Publish releases
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          node tools/package-checks/src/publish.ts
          git push origin --tags

  # After release, so the first ever publish of a package is a release: the registry makes the
  # first version of a package "latest" whatever dist-tag it was published with.
  snapshot:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: npm install --global npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - run: .github/scripts/npm-auth.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish snapshots
        run: node tools/package-checks/src/publish.ts --snapshot ${{ github.run_number }}
