name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Separate from `pnpm build` so local builds stay fast; here it catches stories that
      # typecheck but fail to bundle (MDX, imports Vite cannot resolve).
      - run: pnpm --filter @oakestra/ui build-storybook

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: docker/setup-buildx-action@v4

      - name: Build images
        run: docker compose -f docker-compose.dev.yml build

      - name: Start stack
        run: docker compose -f docker-compose.dev.yml up -d

      - name: Install Playwright Chromium
        run: pnpm --filter @oakestra/e2e exec playwright install --with-deps chromium

      - name: Run e2e
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Dump container logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color

      # Runs even when the job is cancelled, so a superseded run does not leave containers behind.
      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
