name: Release dashboard image

on:
  push:
    tags:
      - 'v*.*.*'
      - 'alpha-v*.*.*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/oakestra/dashboard

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless cosign signing needs an OIDC token for Fulcio.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # Alpha tags must not move "latest".
          flavor: |
            latest=${{ !startsWith(github.ref, 'refs/tags/alpha') }}
          labels: |
            org.opencontainers.image.title=Oakestra Dashboard
            org.opencontainers.image.description=Oakestra dashboard shell (Module Federation host)
            org.opencontainers.image.vendor=Oakestra

      # Only the shell is published. The example addon and mock images exist for e2e only.
      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/shell/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "$TAGS" | xargs -I {} cosign sign --yes {}@"$DIGEST"
