name: Release dashboard image

on:
  push:
    branches:
      - main
    tags:
      # Releases (v1.2.3) and prereleases (v1.3.0-rc.1, -beta.1, -alpha.1).
      - 'v*.*.*'

# Cancel older main runs, otherwise a slow one can push "main" after a newer one.
# Tag runs each get their own group and always finish.
concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/oakestra/dashboard-v2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # Create the GitHub Release for a tag.
      contents: write
      packages: write
      # Keyless cosign signing needs an OIDC token for Fulcio.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: 'v3.1.1'

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          # "latest" is the newest release, main only gets "main" and "sha-<short>". v1.2.3 is
          # pushed as v1.2.3, v1.2, v1 and latest. A prerelease like v1.3.0-rc.1 only gets its own
          # name (metadata-action skips the major/minor patterns for prereleases, the latest rule
          # checks for the "-"). Careful: tagging v1.2.4 after v1.3.0 moves latest back.
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Oakestra Dashboard
            org.opencontainers.image.description=Oakestra dashboard shell (Module Federation host)
            org.opencontainers.image.vendor=Oakestra

      # Only the shell is published. The example addon and mock images exist for e2e only.
      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/shell/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "$TAGS" | xargs -I {} cosign sign --yes {}@"$DIGEST"

      # Releases created in the GitHub UI push their tag too, so the release may exist already.
      - name: Create the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --verify-tag --generate-notes "${prerelease[@]}"
